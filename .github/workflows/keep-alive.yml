name: Render & Supabase College-Hours Keep-Alive

on:
  schedule:
    # Runs every 14 minutes during College Working Hours ONLY (Mon-Fri, 8:30 AM - 5:30 PM IST / 03:00 - 11:59 UTC)
    # Saves ~75% of Render free-tier monthly hours (only ~180 hrs/month used out of 750 free hours)!
    # Nights and weekends sleep naturally to preserve quota.
    - cron: '*/14 3-11 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Execute Keep-Alive Heartbeat
    runs-on: ubuntu-latest

    steps:
      - name: Ping Live Render Backend Service
        run: |
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://svgptc-management.onrender.com"
          fi
          echo "📡 Pinging live Render web service at $URL/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 25 "$URL/health" || echo "000")
          echo "Render response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Render backend is active and awake!"
          else
            echo "⚠️ Ping received status $HTTP_STATUS (Render waking up or ping registered to reset 15-min idle timer)."
          fi

      - name: Direct Database Keep-Alive Query (PostgreSQL / Supabase)
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "🗄️ Executing direct SQL keep-alive query (SELECT 1) on Supabase..."
            npx -y pg -e "
              const { Client } = require('pg');
              const client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false }
              });
              client.connect()
                .then(() => client.query('SELECT 1 as keep_alive_heartbeat, NOW() as current_time'))
                .then(res => {
                  console.log('✅ Supabase database heartbeat successful:', res.rows[0]);
                  return client.end();
                })
                .catch(err => {
                  console.error('❌ Supabase ping error:', err.message);
                  process.exit(0); // Non-blocking
                });
            "
          else
            echo "ℹ️ DATABASE_URL secret is not configured in GitHub Secrets. Skipping direct PostgreSQL ping."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
