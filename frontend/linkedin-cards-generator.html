<head>

  <style>
    :root {
      --primary-navy: #0f172a;
      --accent-gold: #f59e0b;
      --accent-emerald: #10b981;
      --bg-dark: #090d16;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .header-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-box h1 { margin: 0; font-size: 24px; color: #fbbf24; }
    .header-box p { margin: 8px 0 0; color: var(--text-muted); }
    .day-selector {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 24px;
    }
    .preview-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .preview-card h3 {
      margin-top: 0;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .canvas-wrapper {
      background: #0b0f19;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #1e293b;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .code-block {
      background: #020617;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      padding: 14px;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .btn-download {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-download:hover { background: #1e40af; }
  </style>
</head>

    function populateDropdown() {
      const select = document.getElementById('daySelect');
      select.innerHTML = '';
      campaignData.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.day;
        opt.textContent = `Day ${d.day}: ${d.title.split(':')[1] || d.title}`;
        select.appendChild(opt);
      });
    }

    function renderDay(dayNum) {
      const data = campaignData.find(d => d.day == dayNum) || campaignData[0];
      document.getElementById('dayTitle').textContent = data.title;
      document.getElementById('dayFocus').textContent = `🎯 Focus: ${data.focus}`;

      // Image 1
      document.getElementById('img1Type').textContent = data.img1.type;
      document.getElementById('img1Desc').textContent = data.img1.desc;
      document.getElementById('canvas1').innerHTML = `
        <div style="margin-bottom: 10px; color: #fbbf24; font-size: 13px; font-weight: 600;">✨ ${data.img1.type.toUpperCase()} PREVIEW</div>
        <div class="code-block">${escapeHtml(data.img1.code)}</div>
      `;

      // Image 2
      document.getElementById('img2Type').textContent = data.img2.type;
      document.getElementById('img2Desc').textContent = data.img2.desc;
      document.getElementById('canvas2').innerHTML = `
        <div style="margin-bottom: 10px; color: #38bdf8; font-size: 13px; font-weight: 600;">💻 ${data.img2.type.toUpperCase()} SNIPPET</div>
        <div class="code-block">${escapeHtml(data.img2.code)}</div>
      `;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Initialize
    populateDropdown();
    renderDay(1);
  </script>
